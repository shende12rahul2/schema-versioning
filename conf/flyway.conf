# Shared Flyway settings - used for EVERY environment.
# Environment-specific settings (URL, user) live in conf/env/<env>.conf.
# Passwords are NEVER stored in Git: set the FLYWAY_PASSWORD environment variable.

# Where the SQL files are (relative to the repository root).
flyway.locations=filesystem:db/migrations,filesystem:db/callbacks

# History table Flyway keeps in each schema.
flyway.table=flyway_schema_history

# Developers create files on different days and merge in different orders.
# This lets a file merged "late" still run once.
flyway.outOfOrder=true

# Stop if a V file that already ran was edited or deleted.
flyway.validateOnMigrate=true

# Safety: "clean" wipes a schema. Only personal schemas turn this off.
flyway.cleanDisabled=true

# Allow PL/SQL blocks ending with "/" (SQL*Plus style).
flyway.oracle.sqlplus=true
